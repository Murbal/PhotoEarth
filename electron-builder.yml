appId: app.photoearth.desktop
productName: PhotoEarth
copyright: Copyright © 2026 Emirhan Güler
directories:
  output: release/${version}
  buildResources: build
# Everything the app needs is bundled by electron-vite into out/; no node_modules ship.
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: PhotoEarth
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.photography
  icon: build/icon.png
  # No Developer ID yet: sign ad hoc ("-"), which Apple Silicon requires for the app to
  # launch at all. Ad-hoc signatures can't be notarized, and the hardened runtime would need
  # a library-validation entitlement, so it stays off until there's a real identity.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: [AppImage]
  category: Graphics
  icon: build/icon.png
  synopsis: 3D globe for photography location scouting
